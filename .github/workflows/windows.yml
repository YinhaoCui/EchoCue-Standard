name: Windows CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: --no-binary=proxy_tools --target vendor -r requirements.txt
      - name: Download and verify ASR models
        run: python tools/setup_streaming.py --models-only
      - name: Regression tests
        run: python tools/run_tests.py
      - name: Web UI tests (headless Edge)
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          python tools/run_ui_tests.py --require
      - name: Build launcher
        run: ./tools/build_launcher.ps1
      - name: Package clean portable application
        run: python tools/package_release.py
      - name: Validate bundled runtime and models
        shell: pwsh
        run: |
          $release = Get-ChildItem dist -Directory | Select-Object -First 1
          & "$($release.FullName)/_internal/runtime/python/python.exe" -I tools/smoke_release.py $release.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Portable smoke test failed' }
          $check = Start-Process -FilePath "$($release.FullName)/EchoCue.exe" -ArgumentList '--check' -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Launcher validation failed' }
      - name: Install installer compiler
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        run: ./tools/build_installer.ps1 -CompilerPath 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Only the main-branch publish job consumes this large portable bundle.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*Setup-x64.exe
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish new version
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable
          path: artifacts
      - name: Publish release once per version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]
          tag="v$version"
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > published-tags.txt
          if grep -Fxq "$tag" published-tags.txt; then
            echo "Release $tag already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$tag" artifacts/*.zip artifacts/*.exe artifacts/*.sha256 \
            --target "$GITHUB_SHA" --title "EchoCue $version" \
            --notes-file "docs/releases/$version.md"
